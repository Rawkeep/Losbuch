<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Losbuch</title>
<meta name="description" content="Begleiter für deutsche Lotterien: Scheine erfassen, Ziehungen automatisch prüfen, Gewinne und Fristen im Blick.">
<meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15201a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Losbuch">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@500&display=swap">
<style>
/* Ledger-Layout: ein Spaltenbuch, oben Kopfzeile, unten Reiter (Phone) / oben (Desktop). Kugeln für Zahlen, Gold = Treffer. */
:root{
  --bg:#f3f1ea;--paper:#fffdf7;--ink:#1d2a22;--muted:#6b756e;--line:#dcd8cb;
  --accent:#0f6b4a;--accent-ink:#fff;--gold:#d9a21b;--win:#c2410c;--warn:#b45309;--ok:#0f6b4a;--soft:#e9efe9;--shade:rgba(29,42,34,.06);
  --display:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;--body:"DM Sans",system-ui,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15201a;--paper:#1c2922;--ink:#eef0e8;--muted:#9aa89f;--line:#2f4036;--accent:#5fc18f;--accent-ink:#0f1a14;--gold:#e6b83a;--win:#ffb27a;--warn:#f0b35a;--ok:#5fc18f;--soft:#233329;--shade:rgba(255,255,255,.06);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15201a;--paper:#1c2922;--ink:#eef0e8;--muted:#9aa89f;--line:#2f4036;--accent:#5fc18f;--accent-ink:#0f1a14;--gold:#e6b83a;--win:#ffb27a;--warn:#f0b35a;--ok:#5fc18f;--soft:#233329;--shade:rgba(255,255,255,.06);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}img{max-width:100%}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 100px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px 10px;border-bottom:1px solid var(--line)}
h1{font-family:var(--display);font-size:26px;margin:0;letter-spacing:-.01em;line-height:1.1}h1 span{color:var(--gold)}
.sub{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
h2{font-family:var(--display);font-size:20px;margin:22px 0 10px;text-wrap:balance;display:flex;align-items:baseline;gap:10px}
h2 small{font:500 13px var(--body);color:var(--muted)}
h3{font-family:var(--display);font-size:16px;margin:0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;text-align:center;padding:9px 2px 7px;font-size:11px;color:var(--muted);text-decoration:none;font-weight:500;border-top:2px solid transparent;position:relative}
nav.tabs a.on{color:var(--accent);border-top-color:var(--accent)}
nav.tabs a b{display:block;font-size:16px;font-family:var(--display)}
nav.tabs a .badge{position:absolute;top:6px;right:calc(50% - 26px);min-width:16px;height:16px;border-radius:8px;background:var(--win);color:#fff;font-size:10px;line-height:16px;padding:0 4px;font-weight:600}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.win{border-color:var(--gold);box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 30%,transparent)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{min-width:0}.grow{flex:1}
.muted{color:var(--muted);font-size:13px}.hint{font-size:12px;color:var(--muted);line-height:1.4}
.pill{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.win{background:var(--win);color:#fff}.pill.due{background:var(--warn);color:#fff}.pill.ok{background:var(--ok);color:var(--accent-ink)}.pill.gold{background:var(--gold);color:#1d2a22}
.ball{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);font-family:var(--mono);font-size:13px;background:var(--paper)}
.ball.hit{background:var(--gold);border-color:var(--gold);color:#1d2a22;font-weight:600;animation:pop .35s ease-out}
.ball.sz{border-style:dashed}.balls{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
@keyframes pop{from{transform:scale(.6)}60%{transform:scale(1.15)}to{transform:scale(1)}}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
button.p,.btn.p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}button.s{padding:5px 10px;font-size:13px;min-height:32px}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px;max-width:100%;min-height:40px}
textarea{width:100%;font-family:var(--mono);font-size:14px;min-height:72px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}label.f input,label.f select{width:100%}
.check{display:flex;align-items:center;gap:8px;font-size:14px;min-height:40px}.check input{width:20px;height:20px;accent-color:var(--accent)}
.game{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.game .sched{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}.tile .v{font:700 24px var(--display);font-variant-numeric:tabular-nums}.tile .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.empty{color:var(--muted);font-size:14px;padding:18px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:middle}.dot.on{background:var(--ok)}.dot.busy{background:var(--gold)}
.feed li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line)}.feed{padding:0;margin:0}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t th,table.t td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}table.t td.n,table.t th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.twrap{overflow-x:auto}
.scanbox{border:2px dashed var(--line);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.scanbox img{max-height:220px;border-radius:8px}
.prog{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;width:100%}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.onb{display:flex;flex-direction:column;gap:14px;max-width:460px;margin:30px auto}
.onb h2{font-size:28px;margin:0}
.chart{width:100%;height:auto}
/* Jackpot & Tippfeld */
.jp{display:flex;align-items:baseline;gap:8px;padding:6px 0}.jp .jpv{font:700 30px var(--display);color:var(--gold);letter-spacing:-.01em;font-variant-numeric:tabular-nums}.jp .jpl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px}.grid .ball{width:100%;height:38px;padding:0;border-radius:50%;font-weight:500;min-height:38px}.grid .ball.hit{font-weight:700}
.grid.e .ball{border-style:dashed}
.pkrows{display:flex;flex-direction:column;gap:4px}.pkrow{display:flex;gap:8px;align-items:center;justify-content:flex-start;font-family:var(--mono);font-weight:500;font-size:14px;padding:6px 10px;min-height:36px;width:100%;text-align:left}.pkrow.on{border-color:var(--accent);background:var(--soft)}.pkrow .x{margin-left:auto;color:var(--muted);padding:0 4px}
details.alt summary{cursor:pointer}
@media (prefers-reduced-motion:reduce){.toast,.prog i{transition:none}.ball.hit{animation:none}}
@media (min-width:640px){nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);bottom:auto;border-top:0;border-bottom:1px solid var(--line);margin-bottom:8px;padding:0;background:var(--bg)}nav.tabs a .badge{right:calc(50% - 34px)}.wrap{padding-bottom:40px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><div><h1>Los<span>buch</span></h1><div class="sub">Lotterie-Begleiter · Deutschland</div></div><div class="muted" id="status" aria-live="polite"><span class="dot"></span>lokal</div></header>
<nav class="tabs" aria-label="Bereiche">
  <a href="#heute" data-v="heute"><b>Heute</b>Überblick</a>
  <a href="#scheine" data-v="scheine"><b>Scheine</b>+ Scan</a>
  <a href="#ziehungen" data-v="ziehungen"><b>Ziehungen</b>Zahlen</a>
  <a href="#statistik" data-v="statistik"><b>Bilanz</b>Statistik</a>
  <a href="#spiele" data-v="spiele"><b>Spiele</b>Gruppen</a>
  <a href="#einstellungen" data-v="einstellungen"><b>Mehr</b>Sync · Push</a>
</nav>
<main id="view" aria-live="polite"></main>
</div>
<div class="toast" id="toast" role="status"></div>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
